# MuseReel 默认从当前源码构建。可通过 .env 启用自有镜像和 Watchtower。
# 运行 docker compose up -d 后访问 http://localhost:5679。
#
# 数据持久化在命名卷 huobao-data（SQLite + 生成的图片/视频 + 可在线编辑的 workspace/skills）。

services:
  app:
    image: ${MUSEREEL_IMAGE:-musereel:local}
    pull_policy: ${MUSEREEL_PULL_POLICY:-build}
    build:
      context: .
      args:
        # 构建时注入版本号（发布镜像时务必指定，如 HUOBAO_VERSION=1.2.0）
        HUOBAO_VERSION: ${HUOBAO_VERSION:-dev}
    ports:
      - "5679:5679"
    environment:
      HUOBAO_WATCHTOWER_URL: "${MUSEREEL_WATCHTOWER_URL:-}"
      HUOBAO_WATCHTOWER_TOKEN: "${WATCHTOWER_TOKEN:-}"
      # 发布清单（默认 GitHub Releases latest.json，与桌面版同一份）
      # HUOBAO_UPDATE_FEED: https://github.com/784238119/MuseReel/releases/latest/download/latest.json
    volumes:
      - huobao-data:/app/data
    labels:
      # Watchtower --label-enable：只更新显式标记的容器
      com.centurylinklabs.watchtower.enable: "${MUSEREEL_AUTO_UPDATE:-false}"
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:latest
    profiles: [updates]
    command: >
      --http-api-update
      --http-api-token ${WATCHTOWER_TOKEN:-}
      --label-enable
      --cleanup
      --rolling-restart
      --interval 86400
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  huobao-data:
